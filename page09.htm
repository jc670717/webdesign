<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>css background</title>
	<link rel="stylesheet" href="style.css">
	<style>
		h1 {color: blue; font-size: 12px}
		h3 {color: green; font-size: 10px;}
		body {
			background-color: lightblue;
			background-image: url('imgs/yahoo.png');
			background-repeat: no-repeat;
			background-position: right bottom; 
			/*background-image: url('imgs/bg01.jpg');*/
			background-attachment: fixed;
		}
	</style>
</head>
<body>
	<h2>css background</h2>
	<p style="color: white; background-color: navy;">套用navy色號的背景</p>
	<p style="color: white; background-color: rgb(225, 174, 43)";>套用rgb(225, 174, 43)"色號的背景</p>
	<p style="color: white; background-color: rgba(225, 174, 43, 0.3)";>套用rgba(225, 174, 43, 0.3)"色號的背景</p>
	<div style="width:100%; height: 100px; background-color: red;">套用100%寬跟100px高的紅色背景div</div>
	<div style="width:100%; height: 100px; background-image: url('imgs/bg01.jpg'); ">套用100%寬跟100px高的bg01.jpg背景div</div>
	<div style="width: 100%; height: 64px; background-image: url('imgs/yahoo.png');background-repeat: no-repeat;"></div>
	<p>background-repeat: no-repeat</p>


	<p><a href="index.htm">回首頁</a></p>
</body>
</html>
