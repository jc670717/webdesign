	<h2>段落</h2>
	
	<p><a href="https://udn.com/news/story/7266/9662268?from=udn-referralnews_ch2artbottom" target="_blank">白海豚颱風</a>目前強度為強烈颱風。民間氣象粉專「台灣颱風論壇｜天氣特急」今天表示，目前白海豚距離台灣約4200公里，持續朝西北西方向移動，維持強烈颱風等級。<br>未來約1至2天周遭環境仍相當有利，可望維持巔峰狀態。</p>
	<p>之後隨著海洋熱含量下降、風切增強，強度將逐步減弱，但風場範圍可能反而擴大。󠀠</p>
	<p>路徑方面，「台灣颱風論壇｜天氣特急」表示，前期路徑共識已較明確，持續往西北西移動。</p>
