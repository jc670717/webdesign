<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>文字格式</title>
</head>
<body>
	<h2>文字格式</h2>

	<p>一般文字</p>
	<!-- 老師說這是舊的做法以後不要用  -->
	<p><b>一般文字粗體 b</b></p>
	<p><strong>一般文字重要 strong</strong></p>
	<!-- 老師說這是舊的做法以後不要用  -->
	<p><i>一般文字斜體 i</i></p>
	<p><em>一般文字強調 em</em></p>
	<!-- 老師說這個很少用 -->
	<p><mark>一般文字標記 mark</mark></p>
	<p><small>一般文字縮小 small</small></p>
	<p><del>一般文字刪除 del</del></p>
	<p><ins>一般文字底線 ins</ins></p>
	<p>一般文字<sub>下標 sub</sub></p>
	<p>一般文字<sup>上標 sup</sup></p>

	<p><a href="index.htm">回首頁</a></p>
</body>
</html>
