<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>css list</title>

	<style>
		.noicon {
			list-style-type: none;
		}

		.user {
			list-style-image: url("imgs/user.gif");
		}
		ul {
			list-style-type: square;
			
		}
		ol {
			list-style-type: upper-roman;
		}	
	</style>
</head>
<body>
	<h2>css list</h2>

	<ul class="noicon">
		<li>Coffee</li>
		<li>Tea</li>
		<li>Milk</li>
		<li>Juice</li>
		<li>Water</li>
	</ul>

	<ul class="user">
		<li>Coffee</li>
		<li>Tea</li>
		<li>Milk</li>
		<li>Juice</li>
		<li>Water</li>
	</ul>

	<ul>
		<li>Coffee</li>
		<li>Tea</li>
		<li>Milk</li>
		<li>Juice</li>
		<li>Water</li>
	</ul>

	<ol>
		<li>Coffee</li>
		<li>Tea</li>
		<li>Milk</li>
		<li>Juice</li>
		<li>Water</li>
	</ol>

	<p><a href="index.htm">回首頁</a></p>
</body>
</html>
